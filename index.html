/* =========================================================
   PARSE JWT GOOGLE
========================================================= */

function parseJwt(token) {

  const base64Url =
    token.split(".")[1];

  const base64 =
    base64Url
      .replace(/-/g, "+")
      .replace(/_/g, "/");

  const jsonPayload =
    decodeURIComponent(
      atob(base64)
        .split("")
        .map(function (c) {

          return (
            "%" +
            ("00" +
              c.charCodeAt(0).toString(16)
            ).slice(-2)
          );

        })
        .join("")
    );

  return JSON.parse(
    jsonPayload
  );

}

function escapeHtml(text) {

  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    text == null
      ? ""
      : String(text);


  return div.innerHTML;

}

/* =========================================================
   INIT SIGNATURE
========================================================= */

function initSignature() {

  signatureCanvas =
    document.getElementById(
      "signatureCanvas"
    );


  if (!signatureCanvas) {

    console.error(
      "signatureCanvas tidak ditemukan."
    );

    return;

  }


  const rect =
    signatureCanvas.getBoundingClientRect();


  const width =
    rect.width || 500;


  const height =
    rect.height || 220;


  const ratio =
    Math.max(
      window.devicePixelRatio || 1,
      1
    );


  signatureCanvas.width =
    width * ratio;


  signatureCanvas.height =
    height * ratio;


  signatureContext =
    signatureCanvas.getContext(
      "2d"
    );


  signatureContext.setTransform(
    1,
    0,
    0,
    1,
    0,
    0
  );


  signatureContext.scale(
    ratio,
    ratio
  );


  signatureContext.lineWidth =
    2;


  signatureContext.lineCap =
    "round";


  signatureContext.lineJoin =
    "round";


  signatureCanvas.onpointerdown =
    mulaiGambar;


  signatureCanvas.onpointermove =
    gambar;


  signatureCanvas.onpointerup =
    selesaiGambar;


  signatureCanvas.onpointerleave =
    selesaiGambar;


  signatureCanvas.onpointercancel =
    selesaiGambar;

}


/* =========================================================
   MULAI TTD
========================================================= */

function mulaiGambar(event) {

  if (!signatureContext) {

    return;

  }


  sedangMenggambar =
    true;


  const posisi =
    posisiCanvas(event);


  signatureContext.beginPath();


  signatureContext.moveTo(
    posisi.x,
    posisi.y
  );

}


/* =========================================================
   GAMBAR TTD
========================================================= */

function gambar(event) {

  if (
    !sedangMenggambar ||
    !signatureContext
  ) {

    return;

  }


  event.preventDefault();


  const posisi =
    posisiCanvas(event);


  signatureContext.lineTo(
    posisi.x,
    posisi.y
  );


  signatureContext.stroke();

}


/* =========================================================
   SELESAI TTD
========================================================= */

function selesaiGambar() {

  sedangMenggambar =
    false;

}


/* =========================================================
   POSISI CANVAS
========================================================= */

function posisiCanvas(event) {

  const rect =
    signatureCanvas.getBoundingClientRect();


  return {

    x:
      event.clientX -
      rect.left,

    y:
      event.clientY -
      rect.top

  };

}


/* =========================================================
   HAPUS TTD
========================================================= */

function clearSignature() {

  if (
    !signatureCanvas ||
    !signatureContext
  ) {

    return;

  }


  signatureContext.clearRect(

    0,

    0,

    signatureCanvas.width,

    signatureCanvas.height

  );

}
