function muatChecklist() {

  const container =
    document.getElementById(
      "checklistContainer"
    );

  if (!container) {

    console.error(
      "Element checklistContainer tidak ditemukan."
    );

    return;
  }


  container.innerHTML =
    "<div class='loading'>Memuat checklist...</div>";


  fetch(
    API_URL +
    "?action=master_checklist"
  )

    .then(
      function (response) {

        if (!response.ok) {

          throw new Error(
            "HTTP " +
            response.status
          );

        }

        return response.json();

      }
    )

    .then(
      function (result) {

        console.log(
          "HASIL MASTER CHECKLIST:",
          result
        );


        if (!result) {

          throw new Error(
            "Response checklist kosong."
          );

        }


        if (!result.success) {

          throw new Error(
            result.message ||
            "Gagal mengambil data checklist."
          );

        }


        if (!Array.isArray(result.data)) {

          throw new Error(
            "Format data checklist tidak valid."
          );

        }


        container.innerHTML = "";


        let dataUntukDitampilkan =
          result.data;


        /*
         * Filter AKTIF.
         *
         * Mendukung:
         * TRUE
         * YA
         * Y
         * 1
         * AKTIF
         * YES
         */

        const checklistAktif =
          result.data.filter(
            function (item) {

              const aktif =
                item.AKTIF;


              if (
                aktif === true ||
                aktif === 1
              ) {

                return true;

              }


              const nilai =
                String(
                  aktif == null
                    ? ""
                    : aktif
                )
                  .trim()
                  .toUpperCase();


              return (
                nilai === "TRUE" ||
                nilai === "YA" ||
                nilai === "Y" ||
                nilai === "1" ||
                nilai === "AKTIF" ||
                nilai === "YES"
              );

            }
          );


        /*
         * Jika ada checklist aktif,
         * tampilkan hanya checklist aktif.
         *
         * Jika tidak ada status AKTIF,
         * gunakan semua data sebagai fallback.
         */

        if (
          checklistAktif.length > 0
        ) {

          dataUntukDitampilkan =
            checklistAktif;

        }


        if (
          dataUntukDitampilkan.length === 0
        ) {

          container.innerHTML =
            "<div class='loading'>" +
            "Tidak ada checklist tersedia." +
            "</div>";

          return;

        }


        let nomorTampil = 0;


        dataUntukDitampilkan.forEach(
          function (item) {

            nomorTampil++;


            const id =
              item.ID || "";


            const urutan =
              item.URUTAN || "";


            const kategori =
              item.KATEGORI || "";


            const subKategori =
              item.SUB_KATEGORI || "";


            const uraian =
              item.URAIAN || "";


            const standar =
              item.STANDAR || "";


            const div =
              document.createElement("div");


            div.className =
              "checklist-item";


            div.dataset.id =
              id;


            const namaRadio =
              "hasil_" + id;


            let html = "";


            html +=
              "<div class='checklist-header'>";


            html +=
              "<div class='checklist-number'>";


            html +=
              escapeHtml(
                urutan ||
                nomorTampil
              );


            html +=
              "</div>";


            html +=
              "<div class='checklist-content'>";


            html +=
              "<div class='checklist-category'>";


            html +=
              escapeHtml(
                kategori
              );


            if (subKategori) {

              html +=
                " - " +
                escapeHtml(
                  subKategori
                );

            }


            html +=
              "</div>";


            html +=
              "<div class='checklist-description'>";


            html +=
              escapeHtml(
                uraian
              );


            html +=
              "</div>";


            if (standar) {

              html +=
                "<div class='checklist-standard'>";

              html +=
                "<strong>STANDAR:</strong> ";

              html +=
                escapeHtml(
                  standar
                );

              html +=
                "</div>";

            }


            html +=
              "</div>";


            html +=
              "</div>";


            html +=
              "<div class='checklist-choice'>";


            html +=
              "<label class='choice-label'>";


            html +=
              "<input " +
              "type='radio' " +
              "name='" +
              escapeHtml(
                namaRadio
              ) +
              "' " +
              "value='YA'>";


            html +=
              "<span>YA</span>";


            html +=
              "</label>";


            html +=

            html +=

              ) +

}

    i < items.length;

/* =========================================================
   INIT SIGNATURE CANVAS
========================================================= */

function initSignature() {

  signatureCanvas =
    document.getElementById(
      "signatureCanvas"
    );


  if (!signatureCanvas) {

    console.error(
      "signatureCanvas tidak ditemukan."
    );


    return;

  }


  let rect =
    signatureCanvas.getBoundingClientRect();


  let width =
    rect.width;


  if (
    width < 300
  ) {

    width =
      300;

  }


  const height =
    220;


  const ratio =
    Math.max(
      window.devicePixelRatio || 1,
      1
    );


  signatureCanvas.width =
    width * ratio;


  signatureCanvas.height =
    height * ratio;


  signatureCanvas.style.width =
    width + "px";


  signatureCanvas.style.height =
    height + "px";


  signatureContext =
    signatureCanvas.getContext(
      "2d"
    );


  if (!signatureContext) {

    console.error(
      "Canvas context tidak tersedia."
    );


    return;

  }


  signatureContext.setTransform(
    1,
    0,
    0,
    1,
    0,
    0
  );


  signatureContext.scale(
    ratio,
    ratio
  );


  signatureContext.lineWidth =
    2;


  signatureContext.lineCap =
    "round";


  signatureContext.lineJoin =
    "round";


  signatureCanvas.onpointerdown =
    mulaiGambar;


  signatureCanvas.onpointermove =
    gambar;


  signatureCanvas.onpointerup =
    selesaiGambar;


  signatureCanvas.onpointerleave =
    selesaiGambar;


  signatureCanvas.onpointercancel =
    selesaiGambar;

}


/* =========================================================
   MULAI GAMBAR
========================================================= */

function mulaiGambar(event) {

  if (
    !signatureContext
  ) {

    return;

  }


  sedangMenggambar =
    true;


  const posisi =
    posisiCanvas(event);


  signatureContext.beginPath();


  signatureContext.moveTo(
    posisi.x,
    posisi.y
  );

}


/* =========================================================
   GAMBAR TTD
========================================================= */

function gambar(event) {

  if (
    !sedangMenggambar ||
    !signatureContext
  ) {

    return;

  }


  event.preventDefault();


  const posisi =
    posisiCanvas(event);


  signatureContext.lineTo(
    posisi.x,
    posisi.y
  );


  signatureContext.stroke();

}


/* =========================================================
   SELESAI GAMBAR
========================================================= */

function selesaiGambar() {

  sedangMenggambar =
    false;

}


/* =========================================================
   POSISI CANVAS
========================================================= */

function posisiCanvas(event) {

  const rect =
    signatureCanvas.getBoundingClientRect();


  return {

    x:
      event.clientX -
      rect.left,


    y:
      event.clientY -
      rect.top

  };

}


/* =========================================================
   HAPUS TTD
========================================================= */

function clearSignature() {

  if (
    !signatureCanvas ||
    !signatureContext
  ) {

    return;

  }


  signatureContext.clearRect(

    0,

    0,

    signatureCanvas.width,

    signatureCanvas.height

  );


  ttdDataUrl =
    "";

}


/* =========================================================
   SIMPAN TTD
========================================================= */

function simpanTTD() {

  if (
    !idPemeriksaanAktif
  ) {

    alert(
      "ID Pemeriksaan belum tersedia."
    );


    return;

  }


  if (!signatureCanvas) {

    alert(
      "Canvas tanda tangan belum tersedia."
    );


    return;

  }


  if (!signatureContext) {

    alert(
      "Canvas tanda tangan belum siap."
    );


    return;

  }


  const pixelData =
    signatureContext.getImageData(

      0,

      0,

      signatureCanvas.width,

      signatureCanvas.height

    ).data;


  let adaCoretan =
    false;


  for (
    let i = 3;
    i < pixelData.length;
    i += 4
  ) {

    if (
      pixelData[i] !== 0
    ) {

      adaCoretan =
        true;


      break;

    }

  }


  if (!adaCoretan) {

    alert(
      "Silakan buat tanda tangan terlebih dahulu."
    );


    return;

  }


  ttdDataUrl =
    signatureCanvas.toDataURL(
      "image/png"
    );


  tampilkanStatus(
    "Menyimpan tanda tangan..."
  );


  const data = {

    ID_PEMERIKSAAN:
      idPemeriksaanAktif,


    TTD:
      ttdDataUrl,


    EMAIL:
      sessionStorage.getItem(
        "userEmail"
      ) || ""

  };


  fetch(
    API_URL +
    "?action=simpan_ttd",
    {

      method:
        "POST",


      headers: {

        "Content-Type":
          "text/plain;charset=utf-8"

      },


      body:
        JSON.stringify(data)

    }
  )

    .then(
      function (response) {

        if (!response.ok) {

          throw new Error(
            "HTTP " +
            response.status
          );

        }


        return response.json();

      }
    )

    .then(
      function (result) {

        console.log(
          "HASIL SIMPAN TTD:",
          result
        );


        if (
          result.success
        ) {

          tampilkanStatus(
            "Tanda tangan berhasil disimpan."
          );


          alert(
            "Tanda tangan berhasil disimpan."
          );

        }

        else {

          alert(

            result.message ||
            "Gagal menyimpan tanda tangan."

          );

        }

      }
    )

    .catch(
      function (error) {

        console.error(
          "Gagal menyimpan TTD:",
          error
        );


        tampilkanStatus(
          "Gagal menyimpan tanda tangan."
        );


        alert(
          "Gagal menghubungi server saat menyimpan TTD."
        );

      }
    );

}
