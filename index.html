<!-- =========================
     HEADER
========================= -->

<div class="header">

  <h1>
    Checklist Pengawasan Kegiatan Langsir
  </h1>

  <p>
    Sistem Informasi Pengawasan Kegiatan Langsir
  </p>

</div>


<!-- =========================
     CARD UTAMA
========================= -->

<div class="card">


  <!-- GOOGLE LOGIN -->

  <div id="googleLogin"></div>


  <!-- INFORMASI USER -->

  <div
    id="userInfo"
    style="display: none;">
  </div>


  <!-- =========================
       APLIKASI
  ========================= -->

  <div
    id="app"
    style="display: none;">


    <!-- =========================
         DASHBOARD
    ========================= -->

    <div class="dashboard">

      <h1>
        Dashboard
      </h1>

      <p>
        Sistem Informasi Pengawasan Kegiatan Langsir
      </p>


      <!-- =========================
           MENU UTAMA
      ========================= -->

      <div id="menuUtama">

        <button
          onclick="tampilkanDashboard()">
          Dashboard
        </button>

        <button
          onclick="tampilkanFormPemeriksaan()">
          Form Pemeriksaan
        </button>

        <button
          onclick="tampilkanRiwayatPemeriksaan()">
          Riwayat Pemeriksaan
        </button>

        <button
          onclick="tampilkanRekapPemeriksaan()">
          Rekap Pemeriksaan
        </button>

        <button
          onclick="tampilkanDataPegawai()">
          Data Pegawai
        </button>

        <button
          onclick="tampilkanDataStasiun()">
          Data Stasiun
        </button>

        <button
          onclick="tampilkanDataLokomotif()">
          Data Lokomotif
        </button>

      </div>

    </div>


    <!-- =========================
         FORM PEMERIKSAAN
    ========================= -->

    <div
      id="formPemeriksaan"
      style="display: none;">


      <h2>
        Form Pemeriksaan
      </h2>

      <p>
        Form pemeriksaan kegiatan langsir
      </p>


      <div id="identitasPemeriksaan">


        <!-- =========================
             IDENTITAS PEMERIKSAAN
        ========================= -->

        <div class="section-title">
          Identitas Pemeriksaan
        </div>


        <!-- TANGGAL -->

        <div class="form-group">

          <label for="tanggalPemeriksaan">
            Tanggal Pemeriksaan
          </label>

          <input
            type="date"
            id="tanggalPemeriksaan"
          >

        </div>


        <!-- STASIUN -->

        <div class="form-group">

          <label for="stasiunPemeriksaan">
            Stasiun
          </label>

          <select
            id="stasiunPemeriksaan">

            <option value="">
              Pilih Stasiun
            </option>

          </select>

        </div>


        <!-- LOKOMOTIF -->

        <div class="form-group">

          <label for="lokomotifPemeriksaan">
            Lokomotif
          </label>

          <select
            id="lokomotifPemeriksaan">

            <option value="">
              Pilih Lokomotif
            </option>

          </select>

        </div>


        <!-- =========================
             PETUGAS
        ========================= -->

        <div class="section-title">
          Data Petugas
        </div>


        <!-- MASINIS -->

        <div class="form-group">

          <label for="masinisPemeriksaan">
            Masinis
          </label>

          <select
            id="masinisPemeriksaan">

            <option value="">
              Pilih Masinis
            </option>

          </select>

        </div>


        <!-- ASISTEN MASINIS -->

        <div class="form-group">

          <label for="asistenMasinisPemeriksaan">
            Asisten Masinis
          </label>

          <select
            id="asistenMasinisPemeriksaan">

            <option value="">
              Pilih Asisten Masinis
            </option>

          </select>

        </div>


        <!-- PLR 1 -->

        <div class="form-group">

          <label for="plr1Pemeriksaan">
            PLR 1
          </label>

          <select
            id="plr1Pemeriksaan">

            <option value="">
              Pilih PLR 1
            </option>

          </select>

        </div>


        <!-- PLR 2 -->

        <div class="form-group">

          <label for="plr2Pemeriksaan">
            PLR 2
          </label>

          <select
            id="plr2Pemeriksaan">

            <option value="">
              Pilih PLR 2
            </option>

          </select>

        </div>


        <!-- PLR DIPO -->

        <div class="form-group">

          <label for="plrDipoPemeriksaan">
            PLR DIPO
          </label>

          <select
            id="plrDipoPemeriksaan">

            <option value="">
              Pilih PLR DIPO
            </option>

          </select>

        </div>


        <!-- PETUGAS SCHOWING -->

        <div class="form-group">

          <label for="petugasSchowingPemeriksaan">
            Petugas Schowing
          </label>

          <select
            id="petugasSchowingPemeriksaan">

            <option value="">
              Pilih Petugas Schowing
            </option>

          </select>

        </div>


      </div>

    </div>


  </div>

</div>
