<script>

/* =========================================================
   KONFIGURASI
========================================================= */

const API_URL = "MASUKKAN_API_URL_APPS_SCRIPT_ANDA_DI_SINI";

/* =========================================================
   VARIABEL GLOBAL
========================================================= */

let idPemeriksaanAktif = "";

let signatureCanvas = null;
let signatureContext = null;
let sedangMenggambar = false;

let ttdDataUrl = "";


/* =========================================================
   SAAT HALAMAN SIAP
========================================================= */

document.addEventListener("DOMContentLoaded", function () {

  console.log(
    "JavaScript Checklist Pengawasan Kegiatan Langsir siap."
  );

  const ttdBox =
    document.getElementById("ttdBox");

  const dokumentasiBox =
    document.getElementById("dokumentasiFotoBox");

  if (ttdBox) {
    ttdBox.style.display = "none";
  }

  if (dokumentasiBox) {
    dokumentasiBox.style.display = "none";
  }

});


/* =========================================================
   LOAD CHECKLIST
========================================================= */

function muatChecklist() {

  const container =
    document.getElementById("checklistContainer");

  if (!container) {
    console.error("checklistContainer tidak ditemukan.");
    return;
  }

  container.innerHTML =
    "<div class='loading'>Memuat checklist...</div>";

  fetch(
    API_URL + "?action=master_checklist"
  )

    .then(function (response) {

      if (!response.ok) {
        throw new Error(
          "HTTP " + response.status
        );
      }

      return response.json();

    })

    .then(function (result) {

      console.log(
        "HASIL CHECKLIST:",
        result
      );

      if (!result) {
        throw new Error(
          "Response checklist kosong."
        );
      }

      if (!result.success) {

        throw new Error(
          result.message ||
          "Gagal mengambil data checklist."
        );

      }

      if (
        !Array.isArray(result.data)
      ) {

        throw new Error(
          "Format data checklist tidak valid."
        );

      }

      container.innerHTML = "";

      let nomorTampil = 0;

      /*
       * =====================================================
       * FILTER CHECKLIST AKTIF
       *
       * Menerima berbagai kemungkinan isi kolom AKTIF:
       *
       * TRUE
       * true
       * YA
       * Y
       * 1
       * AKTIF
       * =====================================================
       */

      const checklistAktif =
        result.data.filter(function (item) {

          const aktif =
            item.AKTIF;

          if (
            aktif === true ||
            aktif === 1
          ) {
            return true;
          }

          const nilai =
            String(
              aktif == null
                ? ""
                : aktif
            )
              .trim()
              .toUpperCase();

          return (
            nilai === "TRUE" ||
            nilai === "YA" ||
            nilai === "Y" ||
            nilai === "1" ||
            nilai === "AKTIF" ||
            nilai === "YES"
          );

        });


      /*
       * =====================================================
       * DATA YANG DIPAKAI
       *
       * Kalau tidak ada yang lolos filter aktif,
       * tampilkan semua data sebagai fallback.
       * =====================================================
       */

      let dataUntukDitampilkan =
        checklistAktif;

      if (
        checklistAktif.length === 0
      ) {

        console.warn(
          "Tidak ada checklist dengan status aktif."
        );

        console.warn(
          "Menampilkan semua checklist sebagai fallback."
        );

        dataUntukDitampilkan =
          result.data;

      }


      /*
       * =====================================================
       * JIKA DATA BENAR-BENAR KOSONG
       * =====================================================
       */

      if (
        dataUntukDitampilkan.length === 0
      ) {

        container.innerHTML =
          "<div class='loading'>" +
          "Data checklist belum tersedia." +
          "</div>";

        return;

      }


      /*
       * =====================================================
       * TAMPILKAN CHECKLIST
       * =====================================================
       */

      dataUntukDitampilkan.forEach(
        function (item) {

          const id =
            item.ID || "";

          const kategori =
            item.KATEGORI || "";

          const subKategori =
            item.SUB_KATEGORI || "";

          const uraian =
            item.URAIAN || "";

          const standar =
            item.STANDAR || "";

          const nomor =
            item.URUTAN || "";

          nomorTampil++;


          const div =
            document.createElement("div");

          div.className =
            "checklist-item";

          div.dataset.id =
            id;


          const namaRadio =
            "hasil_" + id;


          div.innerHTML =

            "<div class='checklist-header'>" +

              "<div class='checklist-number'>" +

                escapeHtml(
                  nomor ||
                  nomorTampil
                ) +

              "</div>" +


              "<div class='checklist-content'>" +

                "<div class='checklist-category'>" +

                  escapeHtml(
                    kategori
                  ) +

                  (
                    subKategori
                      ? " - " +
                        escapeHtml(
                          subKategori
                        )
                      : ""
                  ) +

                "</div>" +


                "<div class='checklist-description'>" +

                  escapeHtml(
                    uraian
                  ) +

                "</div>" +


                (
                  standar
                    ?

                    "<div class='checklist-standard'>" +

                      "<strong>STANDAR:</strong> " +

                      escapeHtml(
                        standar
                      ) +

                    "</div>"

                    :

                    ""
                ) +

              "</div>" +

            "</div>" +


            "<div class='checklist-choice'>" +

              "<label class='choice-label'>" +

                "<input " +

                  "type='radio' " +

                  "name='" +
                  escapeHtml(
                    namaRadio
                  ) +
                  "' " +

                  "value='YA'>" +

                "<span>YA</span>" +

              "</label>" +


              "<label class='choice-label'>" +

                "<input " +

                  "type='radio' " +

                  "name='" +
                  escapeHtml(
                    namaRadio
                  ) +
                  "' " +

                  "value='TIDAK'>" +

                "<span>TIDAK</span>" +

              "</label>" +

            "</div>" +


            "<textarea " +

              "class='temuan-input' " +

              "data-id='" +
              escapeHtml(
                id
              ) +
              "' " +

              "placeholder='Keterangan / temuan (opsional)'>" +

            "</textarea>";


          container.appendChild(
            div
          );

        }
      );


      console.log(
        "Jumlah checklist ditampilkan:",
        nomorTampil
      );

    })

    .catch(function (error) {

      console.error(
        "Gagal mengambil checklist:",
        error
      );

      container.innerHTML =
        "<div class='loading'>" +

        "Gagal memuat checklist. " +

        "Periksa koneksi API." +

        "</div>";

    });

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(text) {

  const div =
    document.createElement("div");

  div.textContent =
    text == null
      ? ""
      : String(text);

  return div.innerHTML;

}


/* =========================================================
   AMBIL DATA FORM
========================================================= */

function ambilDataForm() {

  const checklist = [];


  document
    .querySelectorAll(".checklist-item")
    .forEach(function (item) {

      const id =
        item.dataset.id || "";


      const pilihan =
        item.querySelector(
          "input[type='radio']:checked"
        );


      const temuan =
        item.querySelector(
          ".temuan-input"
        );


      checklist.push({

        ID_CHECKLIST:
          id,

        HASIL:
          pilihan
            ? pilihan.value
            : "",

        KETERANGAN:
          temuan
            ? temuan.value.trim()
            : ""

      });

    });


  return {

    ID_PEMERIKSAAN:
      idPemeriksaanAktif,

    TANGGAL:
      document.getElementById(
        "tanggalPemeriksaan"
      ).value,

    DINAS_LANGSIR:
      document.getElementById(
        "dinasLangsirPemeriksaan"
      ).value,

    STASIUN:
      document.getElementById(
        "stasiunPemeriksaan"
      ).value,

    LOKOMOTIF:
      document.getElementById(
        "lokomotifPemeriksaan"
      ).value,

    MASINIS:
      document.getElementById(
        "masinisPemeriksaan"
      ).value,

    ASISTEN_MASINIS:
      document.getElementById(
        "asistenMasinisPemeriksaan"
      ).value,

    PLR1:
      document.getElementById(
        "plr1Pemeriksaan"
      ).value,

    PLR2:
      document.getElementById(
        "plr2Pemeriksaan"
      ).value,

    PLR_DIPO:
      document.getElementById(
        "plrDipoPemeriksaan"
      ).value,

    PETUGAS_SCHOWING:
      document.getElementById(
        "petugasSchowingPemeriksaan"
      ).value,

    CATATAN:
      document.getElementById(
        "catatanPemeriksaan"
      ).value,

    EMAIL:
      sessionStorage.getItem(
        "userEmail"
      ) || "",

    NAMA:
      sessionStorage.getItem(
        "userNama"
      ) || "",

    CHECKLIST:
      checklist,

    /*
     * TTD ikut dibawa bersama data pemeriksaan.
     */
    TTD:
      ttdDataUrl || ""

  };

}


/* =========================================================
   VALIDASI IDENTITAS
========================================================= */

function validasiIdentitas() {

  const fields = [

    [
      "tanggalPemeriksaan",
      "Tanggal Pemeriksaan"
    ],

    [
      "dinasLangsirPemeriksaan",
      "Dinas Langsir"
    ],

    [
      "stasiunPemeriksaan",
      "Stasiun"
    ],

    [
      "lokomotifPemeriksaan",
      "Lokomotif"
    ],

    [
      "masinisPemeriksaan",
      "Masinis"
    ],

    [
      "asistenMasinisPemeriksaan",
      "Asisten Masinis"
    ],

    [
      "plr1Pemeriksaan",
      "PLR 1"
    ],

    [
      "plr2Pemeriksaan",
      "PLR 2"
    ],

    [
      "plrDipoPemeriksaan",
      "PLR DIPO"
    ],

    [
      "petugasSchowingPemeriksaan",
      "Petugas Schowing"
    ]

  ];


  for (
    let i = 0;
    i < fields.length;
    i++
  ) {

    const element =
      document.getElementById(
        fields[i][0]
      );


    if (
      !element ||
      !element.value
    ) {

      alert(
        fields[i][1] +
        " wajib diisi."
      );


      if (element) {
        element.focus();
      }


      return false;

    }

  }


  return true;

}


/* =========================================================
   VALIDASI CHECKLIST
========================================================= */

function validasiChecklist() {

  const items =
    document.querySelectorAll(
      ".checklist-item"
    );


  if (
    items.length === 0
  ) {

    alert(
      "Checklist belum tersedia."
    );

    return false;

  }


  for (
    let i = 0;
    i < items.length;
    i++
  ) {

    const pilihan =
      items[i].querySelector(
        "input[type='radio']:checked"
      );


    if (!pilihan) {

      alert(
        "Checklist nomor " +
        (i + 1) +
        " belum diisi."
      );


      items[i].scrollIntoView({

        behavior: "smooth",

        block: "center"

      });


      return false;

    }

  }


  return true;

}


/* =========================================================
   BUAT ID PEMERIKSAAN
========================================================= */

function buatIdPemeriksaan() {

  return "TRX" + Date.now();

}


/* =========================================================
   SIMPAN PEMERIKSAAN
========================================================= */

function simpanPemeriksaan() {

  if (
    !validasiIdentitas()
  ) {
    return;
  }


  if (
    !validasiChecklist()
  ) {
    return;
  }


  if (
    !idPemeriksaanAktif
  ) {

    idPemeriksaanAktif =
      buatIdPemeriksaan();

  }


  const data =
    ambilDataForm();


  data.ID_PEMERIKSAAN =
    idPemeriksaanAktif;


  data.STATUS =
    "SELESAI";


  tampilkanStatus(
    "Menyimpan pemeriksaan..."
  );


  kirimPemeriksaan(
    data,
    "Pemeriksaan berhasil disimpan."
  );

}


/* =========================================================
   KIRIM PEMERIKSAAN KE API
========================================================= */

function kirimPemeriksaan(
  data,
  pesanBerhasil
) {

  fetch(
    API_URL +
    "?action=simpan_pemeriksaan",
    {

      method: "POST",

      headers: {

        "Content-Type":
          "text/plain;charset=utf-8"

      },

      body:
        JSON.stringify(data)

    }
  )

    .then(function (response) {

      if (!response.ok) {

        throw new Error(
          "HTTP " +
          response.status
        );

      }

      return response.json();

    })

    .then(function (result) {

      console.log(
        "HASIL SIMPAN PEMERIKSAAN:",
        result
      );


      if (
        result.success
      ) {

        idPemeriksaanAktif =
          result.id_pemeriksaan ||
          result.ID_PEMERIKSAAN ||
          data.ID_PEMERIKSAAN;


        tampilkanStatus(

          pesanBerhasil +

          " ID Pemeriksaan: " +

          idPemeriksaanAktif

        );


        /*
         * Jika TTD sudah dibuat sebelum pemeriksaan
         * disimpan, sekarang kirim TTD ke server.
         */

        if (
          ttdDataUrl
        ) {

          simpanTTDKeServer(
            idPemeriksaanAktif,
            ttdDataUrl
          );

        }


        alert(

          pesanBerhasil +

          "\nID Pemeriksaan: " +

          idPemeriksaanAktif

        );

      }

      else {

        alert(

          result.message ||

          "Gagal menyimpan pemeriksaan."

        );

      }

    })

    .catch(function (error) {

      console.error(
        "Gagal simpan pemeriksaan:",
        error
      );


      tampilkanStatus(
        "Gagal menyimpan pemeriksaan."
      );


      alert(
        "Gagal menghubungi server saat menyimpan data."
      );

    });

}


/* =========================================================
   STATUS
========================================================= */

function tampilkanStatus(pesan) {

  const box =
    document.getElementById(
      "statusBox"
    );


  if (!box) {
    return;
  }


  box.textContent =
    pesan;


  box.style.display =
    "block";

}


/* =========================================================
   DOKUMENTASI FOTO
========================================================= */

function tampilkanDokumentasiFoto() {

  const box =
    document.getElementById(
      "dokumentasiFotoBox"
    );


  if (!box) {
    return;
  }


  if (
    box.style.display === "block"
  ) {

    box.style.display =
      "none";

    return;

  }


  box.style.display =
    "block";


  box.scrollIntoView({

    behavior: "smooth",

    block: "center"

  });

}


/* =========================================================
   PREVIEW FOTO
========================================================= */

function previewFoto() {

  const input =
    document.getElementById(
      "inputFoto"
    );


  const preview =
    document.getElementById(
      "fotoPreview"
    );


  if (
    !input ||
    !preview
  ) {
    return;
  }


  preview.innerHTML =
    "";


  const files =
    input.files;


  if (
    !files ||
    files.length === 0
  ) {
    return;
  }


  Array
    .from(files)
    .forEach(function (file) {

      if (
        !file.type.startsWith(
          "image/"
        )
      ) {
        return;
      }


      const reader =
        new FileReader();


      reader.onload =
        function (event) {

          const img =
            document.createElement(
              "img"
            );


          img.src =
            event.target.result;


          preview.appendChild(
            img
          );

        };


      reader.readAsDataURL(
        file
      );

    });

}


/* =========================================================
   TAMPILKAN TTD
========================================================= */

function tampilkanTTD() {

  const box =
    document.getElementById(
      "ttdBox"
    );


  if (!box) {

    console.error(
      "ttdBox tidak ditemukan."
    );

    return;

  }


  if (
    box.style.display === "block"
  ) {

    box.style.display =
      "none";

    return;

  }


  box.style.display =
    "block";


  initSignature();


  box.scrollIntoView({

    behavior: "smooth",

    block: "center"

  });

}


/* =========================================================
   INIT SIGNATURE CANVAS
========================================================= */

function initSignature() {

  signatureCanvas =
    document.getElementById(
      "signatureCanvas"
    );


  if (!signatureCanvas) {

    console.error(
      "signatureCanvas tidak ditemukan."
    );

    return;

  }


  const rect =
    signatureCanvas.getBoundingClientRect();


  const width =
    Math.max(
      rect.width,
      300
    );


  const height =
    220;


  const ratio =
    Math.max(
      window.devicePixelRatio || 1,
      1
    );


  signatureCanvas.width =
    width * ratio;


  signatureCanvas.height =
    height * ratio;


  signatureCanvas.style.width =
    width + "px";


  signatureCanvas.style.height =
    height + "px";


  signatureContext =
    signatureCanvas.getContext(
      "2d"
    );


  signatureContext.setTransform(
    1,
    0,
    0,
    1,
    0,
    0
  );


  signatureContext.scale(
    ratio,
    ratio
  );


  signatureContext.lineWidth =
    2;


  signatureContext.lineCap =
    "round";


  signatureContext.lineJoin =
    "round";


  /*
   * Jika sebelumnya sudah ada TTD,
   * tampilkan kembali.
   */

  if (
    ttdDataUrl
  ) {

    const image =
      new Image();


    image.onload =
      function () {

        signatureContext.drawImage(
          image,
          0,
          0,
          width,
          height
        );

      };


    image.src =
      ttdDataUrl;

  }


  signatureCanvas.onpointerdown =
    mulaiGambar;


  signatureCanvas.onpointermove =
    gambar;


  signatureCanvas.onpointerup =
    selesaiGambar;


  signatureCanvas.onpointerleave =
    selesaiGambar;


  signatureCanvas.onpointercancel =
    selesaiGambar;

}


/* =========================================================
   MULAI GAMBAR
========================================================= */

function mulaiGambar(event) {

  if (
    !signatureContext
  ) {
    return;
  }


  sedangMenggambar =
    true;


  const posisi =
    posisiCanvas(event);


  signatureContext.beginPath();


  signatureContext.moveTo(
    posisi.x,
    posisi.y
  );

}


/* =========================================================
   GAMBAR TTD
========================================================= */

function gambar(event) {

  if (
    !sedangMenggambar ||
    !signatureContext
  ) {
    return;
  }


  event.preventDefault();


  const posisi =
    posisiCanvas(event);


  signatureContext.lineTo(
    posisi.x,
    posisi.y
  );


  signatureContext.stroke();

}


/* =========================================================
   SELESAI GAMBAR
========================================================= */

function selesaiGambar() {

  sedangMenggambar =
    false;

}


/* =========================================================
   POSISI CANVAS
========================================================= */

function posisiCanvas(event) {

  const rect =
    signatureCanvas.getBoundingClientRect();


  return {

    x:
      event.clientX -
      rect.left,

    y:
      event.clientY -
      rect.top

  };

}


/* =========================================================
   HAPUS TTD
========================================================= */

function clearSignature() {

  if (
    !signatureCanvas ||
    !signatureContext
  ) {
    return;
  }


  signatureContext.clearRect(

    0,

    0,

    signatureCanvas.width,

    signatureCanvas.height

  );


  ttdDataUrl =
    "";

}


/* =========================================================
   SIMPAN TTD
========================================================= */

function simpanTTD() {

  if (!signatureCanvas) {

    alert(
      "Canvas tanda tangan belum tersedia."
    );

    return;

  }


  if (!signatureContext) {

    alert(
      "Tanda tangan belum siap."
    );

    return;

  }


  /*
   * Cek apakah canvas benar-benar berisi
   * tanda tangan.
   */

  const pixelData =
    signatureContext.getImageData(
      0,
      0,
      signatureCanvas.width,
      signatureCanvas.height
    ).data;


  let adaCoretan =
    false;


  for (
    let i = 3;
    i < pixelData.length;
    i += 4
  ) {

    if (
      pixelData[i] !== 0
    ) {

      adaCoretan =
        true;

      break;

    }

  }


  if (!adaCoretan) {

    alert(
      "Silakan buat tanda tangan terlebih dahulu."
    );

    return;

  }


  /*
   * Simpan TTD di browser terlebih dahulu.
   */

  ttdDataUrl =
    signatureCanvas.toDataURL(
      "image/png"
    );


  /*
   * Kalau pemeriksaan sudah mempunyai ID,
   * langsung kirim ke server.
   */

  if (
    idPemeriksaanAktif
  ) {

    tampilkanStatus(
      "Menyimpan tanda tangan..."
    );


    simpanTTDKeServer(
      idPemeriksaanAktif,
      ttdDataUrl
    );

  }

  else {

    tampilkanStatus(
      "Tanda tangan disimpan sementara. TTD akan disimpan bersama pemeriksaan."
    );


    alert(
      "Tanda tangan berhasil dibuat.\n\n" +
      "TTD akan disimpan setelah pemeriksaan disimpan."
    );

  }

}


/* =========================================================
   KIRIM TTD KE SERVER
========================================================= */

function simpanTTDKeServer(
  idPemeriksaan,
  signature
) {

  if (
    !idPemeriksaan
  ) {

    console.error(
      "ID Pemeriksaan kosong."
    );

    return;

  }


  if (
    !signature
  ) {

    console.error(
      "Data TTD kosong."
    );

    return;

  }


  const data = {

    ID_PEMERIKSAAN:
      idPemeriksaan,

    TTD:
      signature,

    EMAIL:
      sessionStorage.getItem(
        "userEmail"
      ) || ""

  };


  fetch(
    API_URL +
    "?action=simpan_ttd",
    {

      method: "POST",

      headers: {

        "Content-Type":
          "text/plain;charset=utf-8"

      },

      body:
        JSON.stringify(data)

    }
  )

    .then(function (response) {

      if (!response.ok) {

        throw new Error(
          "HTTP " +
          response.status
        );

      }

      return response.json();

    })

    .then(function (result) {

      console.log(
        "HASIL SIMPAN TTD:",
        result
      );


      if (
        result.success
      ) {

        tampilkanStatus(
          "Tanda tangan berhasil disimpan."
        );


        alert(
          "Tanda tangan berhasil disimpan."
        );

      }

      else {

        console.error(
          "Server gagal menyimpan TTD:",
          result
        );


        alert(

          result.message ||

          "Gagal menyimpan tanda tangan."

        );

      }

    })

    .catch(function (error) {

      console.error(
        "Gagal menyimpan TTD:",
        error
      );


      /*
       * TTD tetap tersimpan di variabel lokal
       * sehingga tidak hilang dari form.
       */

      tampilkanStatus(
        "TTD tersimpan di form, tetapi gagal dikirim ke server."
      );


      alert(
        "TTD sudah tersimpan di form, tetapi gagal dikirim ke server."
      );

    });

}


/* =========================================================
   MENU DASHBOARD
========================================================= */

function tampilkanDashboard() {

  const form =
    document.getElementById(
      "formPemeriksaan"
    );


  if (form) {
    form.style.display =
      "none";
  }

}


/* =========================================================
   TAMPILKAN FORM PEMERIKSAAN
========================================================= */

function tampilkanFormPemeriksaan() {

  const form =
    document.getElementById(
      "formPemeriksaan"
    );


  if (!form) {

    console.error(
      "formPemeriksaan tidak ditemukan."
    );

    return;

  }


  form.style.display =
    "block";


  /*
   * Load checklist setiap kali
   * Form Pemeriksaan dibuka.
   */

  muatChecklist();


  form.scrollIntoView({

    behavior: "smooth",

    block: "start"

  });

}
