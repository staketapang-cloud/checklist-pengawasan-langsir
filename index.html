<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Checklist Pengawasan Kegiatan Langsir</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px;
    }

    .header {
      background: white;
      border-radius: 12px;
      padding: 30px 20px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .header h1 {
      margin: 0 0 10px;
      font-size: 28px;
    }

    .header p {
      margin: 0;
      color: #666;
    }

    .card {
      background: white;
      margin-top: 20px;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    .status {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 20px;
      background: #e8f5e9;
      color: #2e7d32;
      font-weight: bold;
      margin-top: 10px;
    }

    @media (max-width: 600px) {
      .container {
        padding: 12px;
      }

      .header h1 {
        font-size: 22px;
      }

      .card {
        padding: 20px 15px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <h1>Checklist Pengawasan Kegiatan Langsir</h1>
      <p>Sistem Informasi Pengawasan Kegiatan Langsir</p>
    </div>

    <div class="card">
      <h2>Frontend Berhasil Dibuat</h2>
      <p>Halaman GitHub Pages siap dikembangkan.</p>

      <div class="status">
        Sistem Siap
      </div>
    </div>

  </div>

</body>
</html>
