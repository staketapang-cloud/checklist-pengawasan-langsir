<script>

/* =========================================================
   KONFIGURASI API
   JANGAN DIUBAH
========================================================= */

const API_URL =
  "https://script.google.com/macros/s/AKfycbw5JhXwGZT0mGzuqFK2JigaN69nLy9WYtoMZLSHehtPUI4YSg0ZSfjA686fY8aaOS7UVQ/exec";


/* =========================================================
   VARIABEL GLOBAL
========================================================= */

let idPemeriksaanAktif = "";

let signatureCanvas = null;
let signatureContext = null;

let sedangMenggambar = false;

let ttdDataUrl = "";


/* =========================================================
   SAAT HALAMAN SIAP
========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  function () {

    console.log(
      "Checklist Pengawasan Kegiatan Langsir - JavaScript aktif."
    );

    const ttdBox =
      document.getElementById("ttdBox");

    const dokumentasiBox =
      document.getElementById("dokumentasiFotoBox");

    if (ttdBox) {

      ttdBox.style.display =
        "none";

    }

    if (dokumentasiBox) {

      dokumentasiBox.style.display =
        "none";

    }

  }
);


/* =========================================================
   LOAD CHECKLIST
========================================================= */

function muatChecklist() {

  const container =
    document.getElementById(
      "checklistContainer"
    );

  if (!container) {

    console.error(
      "checklistContainer tidak ditemukan."
    );

    return;

  }


  container.innerHTML =
    "<div class='loading'>Memuat checklist...</div>";


  fetch(
    API_URL +
    "?action=master_checklist"
  )

    .then(
      function (response) {

        if (!response.ok) {

          throw new Error(
            "HTTP " +
            response.status
          );

        }

        return response.json();

      }
    )

    .then(
      function (result) {

        console.log(
          "HASIL MASTER_CHECKLIST:",
          result
        );


        if (!result) {

          throw new Error(
            "Response checklist kosong."
          );

        }


        if (
          result.success === false
        ) {

          throw new Error(
            result.message ||
            "Gagal mengambil checklist."
          );

        }


        if (
          !Array.isArray(
            result.data
          )
        ) {

          throw new Error(
            "Format data checklist tidak valid."
          );

        }


        container.innerHTML =
          "";


        /*
         * =====================================================
         * AMBIL CHECKLIST AKTIF
         * =====================================================
         */

        const checklistAktif =
          result.data.filter(
            function (item) {

              const aktif =
                item.AKTIF;


              if (
                aktif === true ||
                aktif === 1
              ) {

                return true;

              }


              const nilai =
                String(
                  aktif == null
                    ? ""
                    : aktif
                )
                  .trim()
                  .toUpperCase();


              return (
                nilai === "TRUE" ||
                nilai === "YA" ||
                nilai === "Y" ||
                nilai === "1" ||
                nilai === "AKTIF" ||
                nilai === "YES"
              );

            }
          );


        /*
         * =====================================================
         * JANGAN SAMPAI CHECKLIST KOSONG
         *
         * Jika kolom AKTIF dari Google Sheets
         * terbaca dengan format berbeda,
         * tampilkan seluruh data sebagai fallback.
         * =====================================================
         */

        let dataUntukDitampilkan =
          checklistAktif;


        if (
          checklistAktif.length === 0
        ) {

          console.warn(
            "Tidak ada checklist dengan status AKTIF yang cocok."
          );

          console.warn(
            "Menggunakan seluruh data MASTER_CHECKLIST sebagai fallback."
          );


          dataUntukDitampilkan =
            result.data;

        }


        /*
         * =====================================================
         * DATA BENAR-BENAR KOSONG
         * =====================================================
         */

        if (
          dataUntukDitampilkan.length === 0
        ) {

          container.innerHTML =
            "<div class='loading'>" +
            "Data checklist belum tersedia." +
            "</div>";

          return;

        }


        /*
         * =====================================================
         * TAMPILKAN CHECKLIST
         * =====================================================
         */

        let nomorTampil =
          0;


        dataUntukDitampilkan.forEach(
          function (item) {

            const id =
              item.ID || "";


            const kategori =
              item.KATEGORI || "";


            const subKategori =
              item.SUB_KATEGORI || "";


            const uraian =
              item.URAIAN || "";


            const standar =
              item.STANDAR || "";


            const nomor =
              item.URUTAN || "";


            nomorTampil++;


            const div =
              document.createElement(
                "div"
              );


            div.className =
              "checklist-item";


            div.dataset.id =
              id;


            const namaRadio =
              "hasil_" +
              id;


            /*
             * =================================================
             * BUAT HTML CHECKLIST
             * =================================================
             */

            let html =
              "";


            html +=
              "<div class='checklist-header'>";


            html +=
              "<div class='checklist-number'>" +
              escapeHtml(
                nomor ||
                nomorTampil
              ) +
              "</div>";


            html +=
              "<div class='checklist-content'>";


            html +=
              "<div class='checklist-category'>" +
              escapeHtml(
                kategori
              );


            if (
              subKategori
            ) {

              html +=
                " - " +
                escapeHtml(
                  subKategori
                );

            }


            html +=
              "</div>";


            html +=
              "<div class='checklist-description'>" +
              escapeHtml(
                uraian
              ) +
              "</div>";


            if (
              standar
            ) {

              html +=
                "<div class='checklist-standard'>" +
                "<strong>STANDAR:</strong> " +
                escapeHtml(
                  standar
                ) +
                "</div>";

            }


            html +=
              "</div>";


            html +=
              "</div>";


            /*
             * =================================================
             * PILIHAN YA / TIDAK
             * =================================================
             */

            html +=
              "<div class='checklist-choice'>";


            html +=
              "<label class='choice-label'>";


            html +=
              "<input " +
              "type='radio' " +
              "name='" +
              escapeHtml(
                namaRadio
              ) +
              "' " +
              "value='YA'>";


            html +=
              "<span>YA</span>";


            html +=
              "</label>";


            html +=
              "<label class='choice-label'>";


            html +=
              "<input " +
              "type='radio' " +
              "name='" +
              escapeHtml(
                namaRadio
              ) +
              "' " +
              "value='TIDAK'>";


            html +=
              "<span>TIDAK</span>";


            html +=
              "</label>";


            html +=
              "</div>";


            /*
             * =================================================
             * KETERANGAN / TEMUAN
             * =================================================
             */

            html +=
              "<textarea " +
              "class='temuan-input' " +
              "data-id='" +
              escapeHtml(
                id
              ) +
              "' " +
              "placeholder='Keterangan / temuan (opsional)'>" +
              "</textarea>";


            div.innerHTML =
              html;


            container.appendChild(
              div
            );

          }
        );


        console.log(
          "Jumlah checklist ditampilkan:",
          nomorTampil
        );

      }
    )

    .catch(
      function (error) {

        console.error(
          "Gagal mengambil checklist:",
          error
        );


        container.innerHTML =
          "<div class='loading'>" +
          "Gagal memuat checklist. " +
          "Periksa koneksi API." +
          "</div>";

      }
    );

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(text) {

  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    text == null
      ? ""
      : String(text);


  return div.innerHTML;

}


/* =========================================================
   AMBIL DATA FORM
========================================================= */

function ambilDataForm() {

  const checklist =
    [];


  document
    .querySelectorAll(
      ".checklist-item"
    )
    .forEach(
      function (item) {

        const id =
          item.dataset.id ||
          "";


        const pilihan =
          item.querySelector(
            "input[type='radio']:checked"
          );


        const temuan =
          item.querySelector(
            ".temuan-input"
          );


        checklist.push({

          ID_CHECKLIST:
            id,

          HASIL:
            pilihan
              ? pilihan.value
              : "",

          KETERANGAN:
            temuan
              ? temuan.value.trim()
              : ""

        });

      }
    );


  return {

    ID_PEMERIKSAAN:
      idPemeriksaanAktif,


    TANGGAL:
      document.getElementById(
        "tanggalPemeriksaan"
      ).value,


    DINAS_LANGSIR:
      document.getElementById(
        "dinasLangsirPemeriksaan"
      ).value,


    STASIUN:
      document.getElementById(
        "stasiunPemeriksaan"
      ).value,


    LOKOMOTIF:
      document.getElementById(
        "lokomotifPemeriksaan"
      ).value,


    MASINIS:
      document.getElementById(
        "masinisPemeriksaan"
      ).value,


    ASISTEN_MASINIS:
      document.getElementById(
        "asistenMasinisPemeriksaan"
      ).value,


    PLR1:
      document.getElementById(
        "plr1Pemeriksaan"
      ).value,


    PLR2:
      document.getElementById(
        "plr2Pemeriksaan"
      ).value,


    PLR_DIPO:
      document.getElementById(
        "plrDipoPemeriksaan"
      ).value,


    PETUGAS_SCHOWING:
      document.getElementById(
        "petugasSchowingPemeriksaan"
      ).value,


    CATATAN:
      document.getElementById(
        "catatanPemeriksaan"
      ).value,


    EMAIL:
      sessionStorage.getItem(
        "userEmail"
      ) || "",


    NAMA:
      sessionStorage.getItem(
        "userNama"
      ) || "",


    CHECKLIST:
      checklist,


    /*
     * TTD ikut dikirim bersama pemeriksaan
     * jika sudah dibuat.
     */

    TTD:
      ttdDataUrl || ""

  };

}


/* =========================================================
   VALIDASI IDENTITAS
========================================================= */

function validasiIdentitas() {

  const fields = [

    [
      "tanggalPemeriksaan",
      "Tanggal Pemeriksaan"
    ],

    [
      "dinasLangsirPemeriksaan",
      "Dinas Langsir"
    ],

    [
      "stasiunPemeriksaan",
      "Stasiun"
    ],

    [
      "lokomotifPemeriksaan",
      "Lokomotif"
    ],

    [
      "masinisPemeriksaan",
      "Masinis"
    ],

    [
      "asistenMasinisPemeriksaan",
      "Asisten Masinis"
    ],

    [
      "plr1Pemeriksaan",
      "PLR 1"
    ],

    [
      "plr2Pemeriksaan",
      "PLR 2"
    ],

    [
      "plrDipoPemeriksaan",
      "PLR DIPO"
    ],

    [
      "petugasSchowingPemeriksaan",
      "Petugas Schowing"
    ]

  ];


  for (
    let i = 0;
    i < fields.length;
    i++
  ) {

    const element =
      document.getElementById(
        fields[i][0]
      );


    if (
      !element ||
      !element.value
    ) {

      alert(
        fields[i][1] +
        " wajib diisi."
      );


      if (element) {

        element.focus();

      }


      return false;

    }

  }


  return true;

}


/* =========================================================
   VALIDASI CHECKLIST
========================================================= */

function validasiChecklist() {

  const items =
    document.querySelectorAll(
      ".checklist-item"
    );


  if (
    items.length === 0
  ) {

    alert(
      "Checklist belum tersedia."
    );

    return false;

  }


  for (
    let i = 0;
    i < items.length;
    i++
  ) {

    const pilihan =
      items[i].querySelector(
        "input[type='radio']:checked"
      );


    if (!pilihan) {

      alert(
        "Checklist nomor " +
        (i + 1) +
        " belum diisi."
      );


      items[i].scrollIntoView({

        behavior:
          "smooth",

        block:
          "center"

      });


      return false;

    }

  }


  return true;

}


/* =========================================================
   BUAT ID PEMERIKSAAN
========================================================= */

function buatIdPemeriksaan() {

  return (
    "TRX" +
    Date.now()
  );

}


/* =========================================================
   SIMPAN PEMERIKSAAN
========================================================= */

function simpanPemeriksaan() {

  /*
   * Validasi identitas
   */

  if (
    !validasiIdentitas()
  ) {

    return;

  }


  /*
   * Validasi checklist
   */

  if (
    !validasiChecklist()
  ) {

    return;

  }


  /*
   * Jika belum mempunyai ID,
   * buat ID baru.
   */

  if (
    !idPemeriksaanAktif
  ) {

    idPemeriksaanAktif =
      buatIdPemeriksaan();

  }


  const data =
    ambilDataForm();


  data.ID_PEMERIKSAAN =
    idPemeriksaanAktif;


  data.STATUS =
    "SELESAI";


  tampilkanStatus(
    "Menyimpan pemeriksaan..."
  );


  kirimPemeriksaan(
    data,
    "Pemeriksaan berhasil disimpan."
  );

}


/* =========================================================
   KIRIM PEMERIKSAAN KE API
========================================================= */

function kirimPemeriksaan(
  data,
  pesanBerhasil
) {

  fetch(
    API_URL +
    "?action=simpan_pemeriksaan",
    {

      method:
        "POST",

      headers: {

        "Content-Type":
          "text/plain;charset=utf-8"

      },

      body:
        JSON.stringify(
          data
        )

    }
  )

    .then(
      function (response) {

        if (!response.ok) {

          throw new Error(
            "HTTP " +
            response.status
          );

        }


        return response.json();

      }
    )

    .then(
      function (result) {

        console.log(
          "HASIL SIMPAN PEMERIKSAAN:",
          result
        );


        if (
          result.success
        ) {

          /*
           * Ambil ID dari server jika tersedia.
           */

          idPemeriksaanAktif =
            result.id_pemeriksaan ||
            result.ID_PEMERIKSAAN ||
            data.ID_PEMERIKSAAN;


          tampilkanStatus(

            pesanBerhasil +
            " ID Pemeriksaan: " +
            idPemeriksaanAktif

          );


          /*
           * Jika TTD sudah dibuat sebelum
           * pemeriksaan disimpan,
           * kirim TTD sekarang.
           */

          if (
            ttdDataUrl
          ) {

            simpanTTDKeServer(
              idPemeriksaanAktif,
              ttdDataUrl,
              false
            );

          }


          alert(

            pesanBerhasil +
            "\nID Pemeriksaan: " +
            idPemeriksaanAktif

          );

        }

        else {

          alert(

            result.message ||
            "Gagal menyimpan pemeriksaan."

          );

        }

      }
    )

    .catch(
      function (error) {

        console.error(
          "Gagal simpan pemeriksaan:",
          error
        );


        tampilkanStatus(
          "Gagal menyimpan pemeriksaan."
        );


        alert(
          "Gagal menghubungi server saat menyimpan data."
        );

      }
    );

}


/* =========================================================
   STATUS
========================================================= */

function tampilkanStatus(
  pesan
) {

  const box =
    document.getElementById(
      "statusBox"
    );


  if (!box) {

    return;

  }


  box.textContent =
    pesan;


  box.style.display =
    "block";

}


/* =========================================================
   DOKUMENTASI FOTO
========================================================= */

function tampilkanDokumentasiFoto() {

  const box =
    document.getElementById(
      "dokumentasiFotoBox"
    );


  if (!box) {

    return;

  }


  if (
    box.style.display ===
    "block"
  ) {

    box.style.display =
      "none";


    return;

  }


  box.style.display =
    "block";


  box.scrollIntoView({

    behavior:
      "smooth",

    block:
      "center"

  });

}


/* =========================================================
   PREVIEW FOTO
========================================================= */

function previewFoto() {

  const input =
    document.getElementById(
      "inputFoto"
    );


  const preview =
    document.getElementById(
      "fotoPreview"
    );


  if (
    !input ||
    !preview
  ) {

    return;

  }


  preview.innerHTML =
    "";


  const files =
    input.files;


  if (
    !files ||
    files.length === 0
  ) {

    return;

  }


  Array
    .from(files)
    .forEach(
      function (file) {

        if (
          !file.type.startsWith(
            "image/"
          )
        ) {

          return;

        }


        const reader =
          new FileReader();


        reader.onload =
          function (event) {

            const img =
              document.createElement(
                "img"
              );


            img.src =
              event.target.result;


            preview.appendChild(
              img
            );

          };


        reader.readAsDataURL(
          file
        );

      }
    );

}


/* =========================================================
   TAMPILKAN TTD
========================================================= */

function tampilkanTTD() {

  const box =
    document.getElementById(
      "ttdBox"
    );


  if (!box) {

    console.error(
      "ttdBox tidak ditemukan."
    );

    return;

  }


  /*
   * Jika sedang terbuka,
   * tutup.
   */

  if (
    box.style.display ===
    "block"
  ) {

    box.style.display =
      "none";


    return;

  }


  /*
   * TTD BOLEH DIBUKA
   * SEBELUM SIMPAN PEMERIKSAAN.
   */

  box.style.display =
    "block";


  /*
   * Tunggu browser menampilkan box
   * supaya ukuran canvas benar.
   */

  setTimeout(
    function () {

      initSignature();

      box.scrollIntoView({

        behavior:
          "smooth",

        block:
          "center"

      });

    },
    50
  );

}


/* =========================================================
   INIT SIGNATURE CANVAS
========================================================= */

function initSignature() {

  signatureCanvas =
    document.getElementById(
      "signatureCanvas"
    );


  if (!signatureCanvas) {

    console.error(
      "signatureCanvas tidak ditemukan."
    );

    return;

  }


  const rect =
    signatureCanvas.getBoundingClientRect();


  const width =
    Math.max(
      rect.width,
      300
    );


  const height =
    220;


  const ratio =
    Math.max(
      window.devicePixelRatio ||
      1,
      1
    );


  /*
   * Simpan TTD lama jika ada
   */

  const ttdLama =
    ttdDataUrl;


  signatureCanvas.width =
    width * ratio;


  signatureCanvas.height =
    height * ratio;


  signatureCanvas.style.width =
    width + "px";


  signatureCanvas.style.height =
    height + "px";


  signatureContext =
    signatureCanvas.getContext(
      "2d"
    );


  if (!signatureContext) {

    console.error(
      "Context canvas tidak tersedia."
    );

    return;

  }


  signatureContext.setTransform(
    1,
    0,
    0,
    1,
    0,
    0
  );


  signatureContext.scale(
    ratio,
    ratio
  );


  signatureContext.lineWidth =
    2;


  signatureContext.lineCap =
    "round";


  signatureContext.lineJoin =
    "round";


  /*
   * =====================================================
   * KEMBALIKAN TTD YANG SUDAH ADA
   * =====================================================
   */

  if (
    ttdLama
  ) {

    const image =
      new Image();


    image.onload =
      function () {

        signatureContext.drawImage(
          image,
          0,
          0,
          width,
          height
        );

      };


    image.src =
      ttdLama;

  }


  /*
   * =====================================================
   * EVENT CANVAS
   * =====================================================
   */

  signatureCanvas.onpointerdown =
    mulaiGambar;


  signatureCanvas.onpointermove =
    gambar;


  signatureCanvas.onpointerup =
    selesaiGambar;


  signatureCanvas.onpointerleave =
    selesaiGambar;


  signatureCanvas.onpointercancel =
    selesaiGambar;


  /*
   * Penting untuk HP:
   * mencegah halaman ikut scroll ketika tanda tangan.
   */

  signatureCanvas.style.touchAction =
    "none";

}


/* =========================================================
   MULAI GAMBAR
========================================================= */

function mulaiGambar(
  event
) {

  if (
    !signatureContext
  ) {

    return;

  }


  event.preventDefault();


  sedangMenggambar =
    true;


  const posisi =
    posisiCanvas(
      event
    );


  signatureContext.beginPath();


  signatureContext.moveTo(
    posisi.x,
    posisi.y
  );

}


/* =========================================================
   GAMBAR TTD
========================================================= */

function gambar(
  event
) {

  if (
    !sedangMenggambar ||
    !signatureContext
  ) {

    return;

  }


  event.preventDefault();


  const posisi =
    posisiCanvas(
      event
    );


  signatureContext.lineTo(
    posisi.x,
    posisi.y
  );


  signatureContext.stroke();

}


/* =========================================================
   SELESAI GAMBAR
========================================================= */

function selesaiGambar() {

  sedangMenggambar =
    false;

}


/* =========================================================
   POSISI CANVAS
========================================================= */

function posisiCanvas(
  event
) {

  const rect =
    signatureCanvas.getBoundingClientRect();


  return {

    x:
      event.clientX -
      rect.left,

    y:
      event.clientY -
      rect.top

  };

}


/* =========================================================
   HAPUS TTD
========================================================= */

function clearSignature() {

  if (
    !signatureCanvas ||
    !signatureContext
  ) {

    return;

  }


  signatureContext.clearRect(

    0,

    0,

    signatureCanvas.width,

    signatureCanvas.height

  );


  ttdDataUrl =
    "";


  tampilkanStatus(
    "Tanda tangan dihapus."
  );

}


/* =========================================================
   CEK CANVAS ADA COREtan
========================================================= */

function canvasAdaCoretan() {

  if (
    !signatureCanvas ||
    !signatureContext
  ) {

    return false;

  }


  const pixelData =
    signatureContext.getImageData(

      0,

      0,

      signatureCanvas.width,

      signatureCanvas.height

    ).data;


  for (
    let i = 3;
    i < pixelData.length;
    i += 4
  ) {

    if (
      pixelData[i] !== 0
    ) {

      return true;

    }

  }


  return false;

}


/* =========================================================
   SIMPAN TTD
========================================================= */

function simpanTTD() {

  if (!signatureCanvas) {

    alert(
      "Canvas tanda tangan belum tersedia."
    );

    return;

  }


  if (!signatureContext) {

    alert(
      "Tanda tangan belum siap."
    );

    return;

  }


  /*
   * Pastikan ada coretan.
   */

  if (
    !canvasAdaCoretan()
  ) {

    alert(
      "Silakan buat tanda tangan terlebih dahulu."
    );

    return;

  }


  /*
   * Simpan TTD ke browser/form.
   */

  ttdDataUrl =
    signatureCanvas.toDataURL(
      "image/png"
    );


  /*
   * =====================================================
   * JIKA PEMERIKSAAN BELUM DISIMPAN
   *
   * Jangan kirim ke server dulu.
   * TTD akan ikut ketika Simpan Pemeriksaan.
   * =====================================================
   */

  if (
    !idPemeriksaanAktif
  ) {

    tampilkanStatus(
      "TTD berhasil dibuat dan tersimpan sementara."
    );


    alert(
      "TTD berhasil dibuat.\n\n" +
      "TTD akan disimpan bersama pemeriksaan."
    );


    return;

  }


  /*
   * =====================================================
   * JIKA SUDAH ADA ID PEMERIKSAAN
   * LANGSUNG KIRIM TTD
   * =====================================================
   */

  tampilkanStatus(
    "Menyimpan tanda tangan..."
  );


  simpanTTDKeServer(
    idPemeriksaanAktif,
    ttdDataUrl,
    true
  );

}


/* =========================================================
   KIRIM TTD KE SERVER
========================================================= */

function simpanTTDKeServer(
  idPemeriksaan,
  signature,
  tampilkanAlert
) {

  if (
    !idPemeriksaan
  ) {

    console.error(
      "ID Pemeriksaan kosong."
    );

    return;

  }


  if (
    !signature
  ) {

    console.error(
      "Data TTD kosong."
    );

    return;

  }


  const data = {

    ID_PEMERIKSAAN:
      idPemeriksaan,

    TTD:
      signature,

    EMAIL:
      sessionStorage.getItem(
        "userEmail"
      ) || ""

  };


  console.log(
    "DATA TTD YANG DIKIRIM:",
    {
      ID_PEMERIKSAAN:
        idPemeriksaan,

      TTD:
        "DATA PNG",

      EMAIL:
        data.EMAIL
    }
  );


  fetch(
    API_URL +
    "?action=simpan_ttd",
    {

      method:
        "POST",

      headers: {

        "Content-Type":
          "text/plain;charset=utf-8"

      },

      body:
        JSON.stringify(
          data
        )

    }
  )

    .then(
      function (response) {

        if (!response.ok) {

          throw new Error(
            "HTTP " +
            response.status
          );

        }


        return response.json();

      }
    )

    .then(
      function (result) {

        console.log(
          "HASIL SIMPAN TTD:",
          result
        );


        if (
          result.success
        ) {

          tampilkanStatus(
            "Tanda tangan berhasil disimpan."
          );


          if (
            tampilkanAlert
          ) {

            alert(
              "Tanda tangan berhasil disimpan."
            );

          }

        }

        else {

          console.error(
            "Server gagal menyimpan TTD:",
            result
          );


          alert(

            result.message ||
            "Gagal menyimpan tanda tangan."

          );

        }

      }
    )

    .catch(
      function (error) {

        console.error(
          "Gagal menyimpan TTD:",
          error
        );


        /*
         * TTD tetap ada di form/browser.
         */

        tampilkanStatus(
          "TTD tersimpan di form, tetapi gagal dikirim ke server."
        );


        if (
          tampilkanAlert
        ) {

          alert(
            "TTD tetap tersimpan di form, tetapi gagal dikirim ke server."
          );

        }

      }
    );

}
