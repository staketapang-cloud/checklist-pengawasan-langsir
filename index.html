  <script>


    /* ==========================================
       KONFIGURASI
    ========================================== */

    const CLIENT_ID =
      "566319928782-ichfb0gch47kfea3ge8cvqmoaei0phs4.apps.googleusercontent.com";


    const API_URL =
      "https://script.google.com/macros/s/AKfycbw5JhXwGZT0mGzuqFK2J2igaN69nLy9WYtoMZLSHehtPUI4YSg0ZSfjA686fY8aaOS7UVQ/exec";


    /* ==========================================
       GOOGLE LOGIN
    ========================================== */

    window.onload = function () {

      google.accounts.id.initialize({

        client_id: CLIENT_ID,

        callback: handleCredentialResponse

      });


      google.accounts.id.renderButton(

        document.getElementById("googleLogin"),

        {
          theme: "outline",
          size: "large",
          text: "signin_with",
          shape: "rectangular"
        }

      );


      /* Cek login sebelumnya */

      if (cekStatusLogin()) {

        tampilkanAplikasi();

      }

    };


    /* ==========================================
       HANDLE GOOGLE LOGIN
    ========================================== */

    function handleCredentialResponse(response) {

      console.log(
        "Google Login berhasil:",
        response
      );


      try {

        const payload =
          JSON.parse(
            atob(
              response.credential.split(".")[1]
            )
          );


        const email =
          payload.email;


        console.log(
          "Email Google:",
          email
        );


        fetch(
          API_URL +
          "?action=user&email=" +
          encodeURIComponent(email)
        )

        .then(
          response => response.json()
        )

        .then(
          result => {

            console.log(
              "Hasil pengecekan USER:",
              result
            );


            console.log(
              "Data USER:",
              result.data
            );


            if (
              result.success &&
              result.data
            ) {


              sessionStorage.setItem(
                "isLoggedIn",
                "true"
              );


              sessionStorage.setItem(
                "userEmail",
                result.data.EMAIL
              );


              sessionStorage.setItem(
                "userNama",
                result.data.NAMA
              );


              sessionStorage.setItem(
                "userRole",
                result.data.ROLE
              );


              tampilkanAplikasi();


            } else {

              alert(
                "Email Google belum terdaftar pada USER."
              );

            }

          }
        )

        .catch(
          error => {

            console.error(
              "Gagal menghubungi API USER:",
              error
            );


            alert(
              "Gagal menghubungi server."
            );

          }
        );

      }

      catch (error) {

        console.error(
          "Gagal membaca credential Google:",
          error
        );

      }

    }


    /* ==========================================
       TAMPILKAN APLIKASI
    ========================================== */

    function tampilkanAplikasi() {

      document.getElementById(
        "googleLogin"
      ).style.display = "none";


      document.getElementById(
        "app"
      ).style.display = "block";

    }


    /* ==========================================
       CEK STATUS LOGIN
    ========================================== */

    function cekStatusLogin() {

      return (
        sessionStorage.getItem(
          "isLoggedIn"
        ) === "true"
      );

    }


    /* ==========================================
       DASHBOARD
    ========================================== */

    function tampilkanDashboard() {

      document.getElementById(
        "formPemeriksaan"
      ).style.display = "none";

    }


    /* ==========================================
       FORM PEMERIKSAAN
    ========================================== */

    function tampilkanFormPemeriksaan() {

      document.getElementById(
        "formPemeriksaan"
      ).style.display = "block";


      /* Isi tanggal hari ini */

      const tanggal =
        document.getElementById(
          "tanggalPemeriksaan"
        );


      if (!tanggal.value) {

        const hariIni =
          new Date();


        const tahun =
          hariIni.getFullYear();


        const bulan =
          String(
            hariIni.getMonth() + 1
          ).padStart(2, "0");


        const hari =
          String(
            hariIni.getDate()
          ).padStart(2, "0");


        tanggal.value =
          tahun +
          "-" +
          bulan +
          "-" +
          hari;

      }


      /* Load semua data master */

      loadStasiun();

      loadLokomotif();

      loadPegawai();

    }


    /* ==========================================
       LOAD MASTER STASIUN
    ========================================== */

    function loadStasiun() {

      const select =
        document.getElementById(
          "stasiunPemeriksaan"
        );


      select.innerHTML =
        '<option value="">Memuat data stasiun...</option>';


      fetch(
        API_URL +
        "?action=master_stasiun"
      )

      .then(
        response => response.json()
      )

      .then(
        result => {

          console.log(
            "Data MASTER_STASIUN:",
            result
          );


          select.innerHTML =
            '<option value="">Pilih Stasiun</option>';


          if (
            result.success &&
            Array.isArray(result.data) &&
            result.data.length > 0
          ) {


            result.data.forEach(
              item => {

                const option =
                  document.createElement(
                    "option"
                  );


                option.value =
                  item.ID || "";


                option.textContent =
                  item.STASIUN ||
                  item.NAMA ||
                  "";


                select.appendChild(
                  option
                );

              }
            );


            console.log(
              "Jumlah stasiun:",
              result.data.length
            );


          } else {

            select.innerHTML =
              '<option value="">Data stasiun belum tersedia</option>';

          }

        }
      )

      .catch(
        error => {

          console.error(
            "Gagal mengambil data stasiun:",
            error
          );


          select.innerHTML =
            '<option value="">Gagal memuat stasiun</option>';

        }
      );

    }


    /* ==========================================
       LOAD MASTER LOKOMOTIF
    ========================================== */

    function loadLokomotif() {

      const select =
        document.getElementById(
          "lokomotifPemeriksaan"
        );


      select.innerHTML =
        '<option value="">Memuat data lokomotif...</option>';


      fetch(
        API_URL +
        "?action=master_lokomotif"
      )

      .then(
        response => response.json()
      )

      .then(
        result => {

          console.log(
            "Data MASTER_LOKOMOTIF:",
            result
          );


          select.innerHTML =
            '<option value="">Pilih Lokomotif</option>';


          if (
            result.success &&
            Array.isArray(result.data) &&
            result.data.length > 0
          ) {


            result.data.forEach(
              item => {

                const option =
                  document.createElement(
                    "option"
                  );


                option.value =
                  item.ID || "";


                option.textContent =
                  item.NOMOR_LOK ||
                  item.NAMA ||
                  "";


                select.appendChild(
                  option
                );

              }
            );


            console.log(
              "Jumlah lokomotif:",
              result.data.length
            );


          } else {

            select.innerHTML =
              '<option value="">Data lokomotif belum tersedia</option>';

          }

        }
      )

      .catch(
        error => {

          console.error(
            "Gagal mengambil data lokomotif:",
            error
          );


          select.innerHTML =
            '<option value="">Gagal memuat lokomotif</option>';

        }
      );

    }


    /* ==========================================
       LOAD MASTER PEGAWAI
    ========================================== */

    function loadPegawai() {


      const masinisSelect =
        document.getElementById(
          "masinisPemeriksaan"
        );


      const asistenSelect =
        document.getElementById(
          "asistenMasinisPemeriksaan"
        );


      const plr1Select =
        document.getElementById(
          "plr1Pemeriksaan"
        );


      const plr2Select =
        document.getElementById(
          "plr2Pemeriksaan"
        );


      const plrDipoSelect =
        document.getElementById(
          "plrDipoPemeriksaan"
        );


      const schowingSelect =
        document.getElementById(
          "petugasSchowingPemeriksaan"
        );


      /* Loading */

      masinisSelect.innerHTML =
        '<option value="">Memuat data...</option>';


      asistenSelect.innerHTML =
        '<option value="">Memuat data...</option>';


      plr1Select.innerHTML =
        '<option value="">Memuat data...</option>';


      plr2Select.innerHTML =
        '<option value="">Memuat data...</option>';


      plrDipoSelect.innerHTML =
        '<option value="">Memuat data...</option>';


      schowingSelect.innerHTML =
        '<option value="">Memuat data...</option>';


      fetch(
        API_URL +
        "?action=master_pegawai"
      )

      .then(
        response => response.json()
      )

      .then(
        result => {

          console.log(
            "Data MASTER_PEGAWAI:",
            result
          );


          /* Reset dropdown */

          masinisSelect.innerHTML =
            '<option value="">Pilih Masinis</option>';


          asistenSelect.innerHTML =
            '<option value="">Pilih Asisten Masinis</option>';


          plr1Select.innerHTML =
            '<option value="">Pilih PLR 1</option>';


          plr2Select.innerHTML =
            '<option value="">Pilih PLR 2</option>';


          plrDipoSelect.innerHTML =
            '<option value="">Pilih PLR DIPO</option>';


          schowingSelect.innerHTML =
            '<option value="">Pilih Petugas Schowing</option>';


          if (
            !result.success ||
            !Array.isArray(result.data) ||
            result.data.length === 0
          ) {

            masinisSelect.innerHTML =
              '<option value="">Data pegawai belum tersedia</option>';


            asistenSelect.innerHTML =
              '<option value="">Data pegawai belum tersedia</option>';


            plr1Select.innerHTML =
              '<option value="">Data pegawai belum tersedia</option>';


            plr2Select.innerHTML =
              '<option value="">Data pegawai belum tersedia</option>';


            plrDipoSelect.innerHTML =
              '<option value="">Data pegawai belum tersedia</option>';


            schowingSelect.innerHTML =
              '<option value="">Data pegawai belum tersedia</option>';


            return;

          }


          /* ==================================
             LOOP DATA PEGAWAI
          ================================== */

          result.data.forEach(
            item => {


              const id =
                item.ID || "";


              const nama =
                item.NAMA || "";


              const jabatan =
                String(
                  item.JABATAN || ""
                )
                .trim()
                .toUpperCase();


              const status =
                String(
                  item.STATUS || ""
                )
                .trim()
                .toUpperCase();


              /* Hanya pegawai AKTIF */

              if (
                status !== "AKTIF"
              ) {

                return;

              }


              /* ==================================
                 MASINIS
              ================================== */

              if (
                jabatan === "MASINIS"
              ) {

                tambahOption(
                  masinisSelect,
                  id,
                  nama
                );

              }


              /* ==================================
                 ASISTEN MASINIS
              ================================== */

              if (
                jabatan === "ASISTEN MASINIS"
              ) {

                tambahOption(
                  asistenSelect,
                  id,
                  nama
                );

              }


              /* ==================================
                 PLR 1
              ================================== */

              if (
                jabatan === "PLR 1"
              ) {

                tambahOption(
                  plr1Select,
                  id,
                  nama
                );

              }


              /* ==================================
                 PLR 2
              ================================== */

              if (
                jabatan === "PLR 2"
              ) {

                tambahOption(
                  plr2Select,
                  id,
                  nama
                );

              }


              /* ==================================
                 PLR DIPO
              ================================== */

              if (
                jabatan === "PLR DIPO"
              ) {

                tambahOption(
                  plrDipoSelect,
                  id,
                  nama
                );

              }


              /* ==================================
                 PETUGAS SCHOWING
              ================================== */

              if (
                jabatan === "PETUGAS SCHOWING"
              ) {

                tambahOption(
                  schowingSelect,
                  id,
                  nama
                );

              }

            }
          );


          /* ==================================
             CEK DATA SETIAP JABATAN
          ================================== */

          cekDataKosong(
            masinisSelect,
            "Data Masinis belum tersedia"
          );


          cekDataKosong(
            asistenSelect,
            "Data Asisten Masinis belum tersedia"
          );


          cekDataKosong(
            plr1Select,
            "Data PLR 1 belum tersedia"
          );


          cekDataKosong(
            plr2Select,
            "Data PLR 2 belum tersedia"
          );


          cekDataKosong(
            plrDipoSelect,
            "Data PLR DIPO belum tersedia"
          );


          cekDataKosong(
            schowingSelect,
            "Data Petugas Schowing belum tersedia"
          );


          console.log(
            "MASTER_PEGAWAI berhasil dimuat."
          );

        }
      )

      .catch(
        error => {

          console.error(
            "Gagal mengambil data pegawai:",
            error
          );


          tampilkanErrorPegawai(
            masinisSelect
          );


          tampilkanErrorPegawai(
            asistenSelect
          );


          tampilkanErrorPegawai(
            plr1Select
          );


          tampilkanErrorPegawai(
            plr2Select
          );


          tampilkanErrorPegawai(
            plrDipoSelect
          );


          tampilkanErrorPegawai(
            schowingSelect
          );

        }
      );

    }


    /* ==========================================
       TAMBAH OPTION
    ========================================== */

    function tambahOption(
      select,
      value,
      text
    ) {

      const option =
        document.createElement(
          "option"
        );


      option.value =
        value;


      option.textContent =
        text;


      select.appendChild(
        option
      );

    }


    /* ==========================================
       CEK DROPDOWN KOSONG
    ========================================== */

    function cekDataKosong(
      select,
      pesan
    ) {

      if (
        select.options.length === 1
      ) {

        const option =
          select.options[0];


        option.textContent =
          pesan;

      }

    }


    /* ==========================================
       ERROR DATA PEGAWAI
