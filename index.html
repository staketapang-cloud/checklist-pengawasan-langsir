<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Checklist Pengawasan Kegiatan Langsir</title>
  
  <meta name="google-signin-client_id" content="566319928782-ichfb0gch47kfea3ge8cvqmoaei0phs4.apps.googleusercontent.com">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px;
    }

    .header {
      background: white;
      border-radius: 12px;
      padding: 30px 20px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .header h1 {
      margin: 0 0 10px;
      font-size: 28px;
    }

    .header p {
      margin: 0;
      color: #666;
    }

    .card {
      background: white;
      margin-top: 20px;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    .status {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 20px;
      background: #e8f5e9;
      color: #2e7d32;
      font-weight: bold;
      margin-top: 10px;
    }

    @media (max-width: 600px) {
      .container {
        padding: 12px;
      }

      .header h1 {
        font-size: 22px;
      }

      .card {
        padding: 20px 15px;
      }
    }
  </style>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>

  <div class="container">

    <div class="header">
      <h1>Checklist Pengawasan Kegiatan Langsir</h1>
      <p>Sistem Informasi Pengawasan Kegiatan Langsir</p>
    </div>

    <div class="card">
      <div id="googleLogin"></div>
      <h2>Frontend Berhasil Dibuat</h2>
      <p>Halaman GitHub Pages siap dikembangkan.</p>

      <div class="status">
        Sistem Siap
      </div>
    </div>

  </div>
<script>
  window.onload = function () {
    google.accounts.id.initialize({
      client_id: "566319928782-ichfb0gch47kfea3ge8cvqmoaei0phs4.apps.googleusercontent.com",
      callback: handleCredentialResponse
    });

    google.accounts.id.renderButton(
      document.getElementById("googleLogin"),
      {
        theme: "outline",
        size: "large",
        text: "signin_with",
        shape: "rectangular"
      }
    );
  };

function handleCredentialResponse(response) {
  console.log("Google Login berhasil:", response);

  // Decode credential Google (JWT)
  const payload = JSON.parse(atob(response.credential.split(".")[1]));

  // Ambil email user
  const email = payload.email;

  console.log("Email Google:", email);

  // URL API Apps Script
  const API_URL =
    "https://script.google.com/macros/s/AKfycbw5JhXwGZT0mGzuqFK2JigaN69nLy9WYtoMZLSHehtPUI4YSg0ZSfjA686fY8aaOS7UVQ/exec";

  // Hubungkan email dengan API USER
  fetch(API_URL + "?action=user&email=" + encodeURIComponent(email))
    .then(response => response.json())
.then(result => {
  console.log("Hasil pengecekan USER:", result);
  console.log("Data USER:", result.data);
})
    .catch(error => {
  console.error("Gagal menghubungi API USER:", error);
});
}
</script>
</body>
</html>
