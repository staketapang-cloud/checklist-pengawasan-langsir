  <script>


    /* ==========================================
       KONFIGURASI
    ========================================== */

    const CLIENT_ID =
      "566319928782-ichfb0gch47kfea3ge8cvqmoaei0phs4.apps.googleusercontent.com";


    const API_URL =
      "https://script.google.com/macros/s/AKfycbw5JhXwGZT0mGzuqFK2JigaN69nLy9WYtoMZLSHehtPUI4YSg0ZSfjA686fY8aaOS7UVQ/exec";


    /* ==========================================
       GOOGLE LOGIN
    ========================================== */

    window.onload = function () {


      google.accounts.id.initialize({

        client_id: CLIENT_ID,

        callback:
          handleCredentialResponse

      });


      google.accounts.id.renderButton(

        document.getElementById(
          "googleLogin"
        ),

        {

          theme: "outline",

          size: "large",

          text: "signin_with",

          shape: "rectangular"

        }

      );


      if (cekStatusLogin()) {

        tampilkanAplikasi();

      }

    };


    /* ==========================================
       HANDLE GOOGLE LOGIN
    ========================================== */

    function handleCredentialResponse(
      response
    ) {


      console.log(
        "Google Login berhasil:",
        response
      );


      try {


        const payload =
          JSON.parse(
            atob(
              response.credential
                .split(".")[1]
            )
          );


        const email =
          payload.email;


        console.log(
          "Email Google:",
          email
        );


        fetch(
          API_URL +
          "?action=user&email=" +
          encodeURIComponent(email)
        )


        .then(
          response =>
            response.json()
        )


        .then(
          result => {


            console.log(
              "Hasil pengecekan USER:",
              result
            );


            if (
              result.success &&
              result.data
            ) {


              sessionStorage.setItem(
                "isLoggedIn",
                "true"
              );


              sessionStorage.setItem(
                "userEmail",
                result.data.EMAIL
              );


              sessionStorage.setItem(
                "userNama",
                result.data.NAMA
              );


              sessionStorage.setItem(
                "userRole",
                result.data.ROLE
              );


              tampilkanAplikasi();


            }

            else {


              alert(
                "Email Google belum terdaftar pada USER."
              );

            }

          }

        )


        .catch(
          error => {

            console.error(
              "Gagal menghubungi API USER:",
              error
            );


            alert(
              "Gagal menghubungi server."
            );

          }
        );


      }

      catch (error) {


        console.error(
          "Gagal membaca credential Google:",
          error
        );

      }

    }


    /* ==========================================
       TAMPILKAN APLIKASI
    ========================================== */

    function tampilkanAplikasi() {


      document.getElementById(
        "googleLogin"
      ).style.display = "none";


      document.getElementById(
        "app"
      ).style.display = "block";

    }


    /* ==========================================
       CEK LOGIN
    ========================================== */

    function cekStatusLogin() {

      return (
        sessionStorage.getItem(
          "isLoggedIn"
        ) === "true"
      );

    }


    /* ==========================================
       DASHBOARD
    ========================================== */

    function tampilkanDashboard() {


      document.getElementById(
        "formPemeriksaan"
      ).style.display = "none";

    }


    /* ==========================================
       FORM PEMERIKSAAN
    ========================================== */

    function tampilkanFormPemeriksaan() {


      document.getElementById(
        "formPemeriksaan"
      ).style.display = "block";


      loadStasiun();

      loadLokomotif();

      loadPegawai();

    }


    /* ==========================================
       LOAD STASIUN
    ========================================== */

    function loadStasiun() {


      const select =
        document.getElementById(
          "stasiunPemeriksaan"
        );


      select.innerHTML =
        '<option value="">Memuat data stasiun...</option>';


      fetch(
        API_URL +
        "?action=master_stasiun"
      )


      .then(
        response =>
          response.json()
      )


      .then(
        result => {


          console.log(
            "Data MASTER_STASIUN:",
            result
          );


          select.innerHTML =
            '<option value="">Pilih Stasiun</option>';


          if (
            result.success &&
            Array.isArray(result.data)
          ) {


            result.data.forEach(
              item => {


                const option =
                  document.createElement(
                    "option"
                  );


                option.value =
                  item.ID || "";


                option.textContent =
                  item.STASIUN || "";


                select.appendChild(
                  option
                );

              }
            );

          }

        }
      )


      .catch(
        error => {


          console.error(
            "Gagal mengambil data stasiun:",
            error
          );


          select.innerHTML =
            '<option value="">Gagal memuat stasiun</option>';

        }
      );

    }


    /* ==========================================
       LOAD LOKOMOTIF
    ========================================== */

    function loadLokomotif() {


      const select =
        document.getElementById(
          "lokomotifPemeriksaan"
        );


      select.innerHTML =
        '<option value="">Memuat data lokomotif...</option>';


      fetch(

      )

          );


          select.innerHTML =
            '<option value="">Pilih Lokomotif</option>';


          if (
            result.success &&
            Array.isArray(result.data)
          ) {


            result.data.forEach(
              item => {

                  document.createElement(
                    "option"
                  );


                option.value =
                  item.ID || "";


                option.textContent =
                  item.NOMOR_LOK || "";


                select.appendChild(
                  option
                );

              }
            );

          }

        }
      )


      .catch(
        error => {

          );


          select.innerHTML =
            '<option value="">Gagal memuat lokomotif</option>';

        }
      );

    }


    /* ==========================================
       LOAD MASTER PEGAWAI
    ========================================== */

    function loadPegawai() {


      const masinis =
        document.getElementById(
          "masinisPemeriksaan"
        );


      const asisten =
        document.getElementById(
          "asistenMasinisPemeriksaan"
        );


      const plr1 =
        document.getElementById(
          "plr1Pemeriksaan"
        );


      const plr2 =
        document.getElementById(
          "plr2Pemeriksaan"
        );


      const plrDipo =
        document.getElementById(
          "plrDipoPemeriksaan"
        );


      const schowing =
        document.getElementById(
          "petugasSchowingPemeriksaan"
        );


      /* =========================
         LOADING
      ========================= */

      masinis.innerHTML =
        '<option value="">Memuat...</option>';


      asisten.innerHTML =
        '<option value="">Memuat...</option>';


      plr1.innerHTML =
        '<option value="">Memuat...</option>';


      plr2.innerHTML =
        '<option value="">Memuat...</option>';


      plrDipo.innerHTML =
        '<option value="">Memuat...</option>';


      schowing.innerHTML =
        '<option value="">Memuat...</option>';


      /* =========================
         AMBIL DATA API
      ========================= */

      fetch(
        API_URL +
        "?action=master_pegawai"
      )


      .then(
        response =>
          response.json()
      )


      .then(
        result => {


          console.log(
            "Data MASTER_PEGAWAI:",
            result
          );


          /* RESET */

          masinis.innerHTML =
            '<option value="">Pilih Masinis</option>';


          asisten.innerHTML =
            '<option value="">Pilih Asisten Masinis</option>';


          plr1.innerHTML =
            '<option value="">Pilih PLR 1</option>';


          plr2.innerHTML =
            '<option value="">Pilih PLR 2</option>';


          plrDipo.innerHTML =
            '<option value="">Pilih PLR DIPO</option>';


          schowing.innerHTML =
            '<option value="">Pilih Petugas Schowing</option>';


          if (
            !result.success ||
            !Array.isArray(result.data)
          ) {


            console.warn(
              "Data MASTER_PEGAWAI tidak tersedia."
            );


            return;

          }


          /* =========================
             LOOP PEGAWAI
          ========================= */

          result.data.forEach(
            item => {


              const id =
                item.ID || "";


              const nama =
                item.NAMA || "";


              const jabatan =
                String(
                  item.JABATAN || ""
                )
                .trim()
                .toUpperCase();


              const status =
                String(
                  item.STATUS || ""
                )
                .trim()
                .toUpperCase();


              /* HANYA AKTIF */

              if (
                status !== "AKTIF"
              ) {

                return;

              }


              /* =========================
                 BUAT OPTION
              ========================= */

              function buatOption() {


                const option =
                  document.createElement(
                    "option"
                  );


                option.value = id;

                option.textContent = nama;


                return option;

              }


              /* =========================
                 MASINIS
              ========================= */

              if (
                jabatan === "MASINIS"
              ) {


                masinis.appendChild(
                  buatOption()
                );

              }


              /* =========================
                 ASISTEN MASINIS
              ========================= */

              if (
                jabatan ===
                "ASISTEN MASINIS"
              ) {


                asisten.appendChild(
                  buatOption()
                );

              }


              /* =========================
                 PLR 1
              ========================= */

              if (
                jabatan === "PLR 1" ||
                jabatan === "PLR1"
              ) {


                plr1.appendChild(
                  buatOption()
                );

              }


              /* =========================
                 PLR 2
              ========================= */

              if (
                jabatan === "PLR 2" ||
                jabatan === "PLR2"
              ) {


                plr2.appendChild(
                  buatOption()
                );

              }


              /* =========================
                 PLR DIPO
              ========================= */

              if (
                jabatan === "PLR DIPO" ||
                jabatan === "PLR_DIPO" ||
                jabatan === "PLRDIPO"
              ) {


                plrDipo.appendChild(
                  buatOption()
                );

              }


              /* =========================
                 PETUGAS SCHOWING
              ========================= */

              if (
                jabatan === "PETUGAS SCHOWING" ||
                jabatan === "SCHOWING" ||
                jabatan === "PETUGAS SHOWING"
              ) {


                schowing.appendChild(
                  buatOption()
                );

              }

            }
          );

        }
      )


      .catch(
        error => {


          console.error(
            "Gagal mengambil data pegawai:",
            error
          );


          masinis.innerHTML =
            '<option value="">Gagal memuat data</option>';


          asisten.innerHTML =
            '<option value="">Gagal memuat data</option>';


          plr1.innerHTML =
            '<option value="">Gagal memuat data</option>';


          plr2.innerHTML =
            '<option value="">Gagal memuat data</option>';


          plrDipo.innerHTML =
            '<option value="">Gagal memuat data</option>';


          schowing.innerHTML =
            '<option value="">Gagal memuat data</option>';

        }
      );

    }


    /* ==========================================
