        "";

        "";

        item.sub_kategori ??
        "";

        item.URAIAN ??
        item.uraian ??
        "";

        item.standar ??

        item.AKTIF ??
        item.aktif ??
        "";

       * true

       * Y

  const div =
    document.createElement("div");


  div.textContent =
    text == null
      ? ""

  return div.innerHTML;

}

function validasiChecklist() {

  const items =
    document.querySelectorAll(
      ".checklist-item"
    );


  if (items.length === 0) {

    alert(
      "Checklist belum tersedia."
    );


    return false;

  }


  for (
    let i = 0;
    i < items.length;
    i++
  ) {

    const pilihan =
      items[i].querySelector(
        "input[type='radio']:checked"
      );


    if (!pilihan) {

      alert(
        "Checklist nomor " +
        (i + 1) +
        " belum diisi."
      );


      items[i].scrollIntoView({

        behavior: "smooth",

        block: "center"

      });


      return false;

    }

  }


  return true;

}

/* =========================================================
   KIRIM PEMERIKSAAN
   ========================================================= */

function kirimPemeriksaan(
  data,
  pesanBerhasil
) {

  fetch(
    API_URL +
    "?action=simpan_pemeriksaan",
    {

      method: "POST",

      headers: {

        "Content-Type":
          "text/plain;charset=utf-8"

      },

      body:
        JSON.stringify(data)

    }
  )


  .then(function (response) {

    if (!response.ok) {

      throw new Error(
        "HTTP " + response.status
      );

    }


    return response.json();

  })


  .then(function (result) {

    console.log(
      "HASIL SIMPAN:",
      result
    );


    if (result.success) {

      idPemeriksaanAktif =
        result.id_pemeriksaan ||
        result.ID_PEMERIKSAAN ||
        data.ID_PEMERIKSAAN;


      tampilkanStatus(

        pesanBerhasil +
        " ID Pemeriksaan: " +
        idPemeriksaanAktif

      );


      alert(

        pesanBerhasil +
        "\nID Pemeriksaan: " +
        idPemeriksaanAktif

      );

    }

    else {

      alert(

        result.message ||
        "Gagal menyimpan pemeriksaan."

      );

    }

  })


  .catch(function (error) {

    console.error(
      "Gagal simpan:",
      error
    );


    alert(
      "Gagal menghubungi server saat menyimpan data."
    );

  });

}

/* =========================================================
   INIT SIGNATURE
   ========================================================= */

function initSignature() {

  signatureCanvas =
    document.getElementById(
      "signatureCanvas"
    );


  if (!signatureCanvas) {
    return;
  }


  const ratio =
    Math.max(
      window.devicePixelRatio || 1,
      1
    );


  const rect =
    signatureCanvas.getBoundingClientRect();


  signatureCanvas.width =
    rect.width * ratio;


  signatureCanvas.height =
    rect.height * ratio;


  signatureContext =
    signatureCanvas.getContext(
      "2d"
    );


  signatureContext.setTransform(
    1,
    0,
    0,
    1,
    0,
    0
  );


  signatureContext.scale(
    ratio,
    ratio
  );


  signatureContext.lineWidth =
    2;


  signatureContext.lineCap =
    "round";


  signatureContext.lineJoin =
    "round";


  signatureCanvas.onpointerdown =
    mulaiGambar;


  signatureCanvas.onpointermove =
    gambar;


  signatureCanvas.onpointerup =
    selesaiGambar;


  signatureCanvas.onpointerleave =
    selesaiGambar;

}


/* =========================================================
   MULAI TTD
   ========================================================= */

function mulaiGambar(event) {

  if (!signatureContext) {
    return;
  }


  sedangMenggambar =
    true;


  const posisi =
    posisiCanvas(event);


  signatureContext.beginPath();


  signatureContext.moveTo(
    posisi.x,
    posisi.y
  );

}


/* =========================================================
   GAMBAR TTD
   ========================================================= */

function gambar(event) {

  if (
    !sedangMenggambar ||
    !signatureContext
  ) {

    return;

  }


  const posisi =
    posisiCanvas(event);


  signatureContext.lineTo(
    posisi.x,
    posisi.y
  );


  signatureContext.stroke();

}


/* =========================================================
   SELESAI TTD
   ========================================================= */

function selesaiGambar() {

  sedangMenggambar =
    false;

}


/* =========================================================
   POSISI CANVAS
   ========================================================= */

function posisiCanvas(event) {

  const rect =
    signatureCanvas.getBoundingClientRect();


  return {

    x:
      event.clientX -
      rect.left,


    y:
      event.clientY -
      rect.top

  };

}


/* =========================================================
   HAPUS TTD
   ========================================================= */

function clearSignature() {

  if (
    !signatureCanvas ||
    !signatureContext
  ) {

    return;

  }


  signatureContext.clearRect(

    0,

    0,

    signatureCanvas.width,

    signatureCanvas.height

  );

}
